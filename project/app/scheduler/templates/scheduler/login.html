{% load static %}<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 井下排班系统</title>
    <link href="{% static 'scheduler/bootstrap.min.css' %}" rel="stylesheet">
    <style>
        body {
            margin: 0; min-height: 100vh;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 45%, #e0c3fc 100%);
            background-attachment: fixed;
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            width: 380px; max-width: 92vw;
            background: rgba(255,255,255,.75);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,.55);
            border-radius: 20px;
            box-shadow: 0 12px 34px rgba(90,120,190,.25);
            padding: 34px 32px; text-align: center;
        }
        .form-control, .form-select {
            background: rgba(255,255,255,.8); border: 1px solid rgba(120,150,210,.35);
            border-radius: 10px;
        }
        .form-control:focus { background: #fff; border-color: #6a9cf5; box-shadow: 0 0 0 .2rem rgba(106,156,245,.18); }
        .btn-primary { background: linear-gradient(90deg,#6a9cf5,#8fb8ff); border: none; border-radius: 10px; font-weight: 600; }
        .btn-primary:hover { background: linear-gradient(90deg,#5a8ce8,#7fa8f5); }
    </style>
</head>
<body>
<div class="login-card">
    <div style="font-size:2.8rem;">⛏</div>
    <h4 class="fw-bold mb-1">井下排班系统</h4>
    <div class="text-muted" style="font-size:.85rem; margin-bottom:24px;">请使用您的账号登录</div>

    {% if error %}<div class="alert alert-danger py-2" style="font-size:.9rem;">{{ error }}</div>{% endif %}

    <form method="post">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <div class="mb-3 text-start">
            <label class="form-label fw-semibold" style="font-size:.9rem;">账号</label>
            <input type="text" name="username" class="form-control" placeholder="请输入账号" autofocus autocomplete="username">
        </div>
        <div class="mb-4 text-start">
            <label class="form-label fw-semibold" style="font-size:.9rem;">密码</label>
            <input type="password" name="password" class="form-control" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button class="btn btn-primary w-100 py-2" type="submit">登 录</button>
    </form>
</div>
</body>
</html>
