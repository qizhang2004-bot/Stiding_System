{% extends "base.html" %}

{% block title %}创建账号 - Stiding 排班系统{% endblock %}

{% block breadcrumb %}<div class="breadcrumb"><a href="{% url 'core:dashboard' %}">工作台</a> / <a href="{% url 'accounts:user_list' %}">账号管理</a> / 创建账号</div>{% endblock %}
{% block page_title %}创建账号{% endblock %}

{% block content %}
<div class="card" style="max-width: 640px;">
  <form method="post" class="form" data-guard-submit>
    {% csrf_token %}
    {% include "includes/_form_fields.html" %}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">创建账号</button>
      <a class="btn" href="{% url 'accounts:user_list' %}">取消</a>
    </div>
  </form>
</div>
{% endblock %}
