<div class="modal-backdrop" id="confirm-modal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
    <div class="modal-head">操作确认</div>
    <div class="modal-body"><p id="confirm-text"></p></div>
    <div class="modal-actions">
      <button type="button" class="btn" id="confirm-cancel">取消</button>
      <button type="button" class="btn btn-danger" id="confirm-ok">确认</button>
    </div>
  </div>
</div>
