{% if form.non_field_errors %}
<div class="form-errors">
  {% for error in form.non_field_errors %}<p class="field-error">{{ error }}</p>{% endfor %}
</div>
{% endif %}
{% for field in form %}
  <div class="field{% if field.errors %} field-invalid{% endif %}{% if field.field.widget.input_type == 'hidden' %} field-hidden{% endif %}">
    <label for="{{ field.id_for_label }}">
      {{ field.label }}{% if field.field.required %}<span class="required">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}<p class="field-help">{{ field.help_text|safe }}</p>{% endif %}
    {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
  </div>
{% endfor %}
