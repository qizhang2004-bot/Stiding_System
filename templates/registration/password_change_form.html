{% extends "base.html" %}

{% block title %}修改密码 - Stiding 排班系统{% endblock %}

{% block breadcrumb %}<div class="breadcrumb">账户 / 修改密码</div>{% endblock %}
{% block page_title %}修改密码{% endblock %}

{% block content %}
<div class="card" style="max-width: 480px;">
  <form method="post" class="form" data-guard-submit>
    {% csrf_token %}
    {% include "includes/_form_fields.html" %}
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">修改密码</button>
      <a class="btn" href="{% url 'accounts:home' %}">取消</a>
    </div>
  </form>
</div>
{% endblock %}
