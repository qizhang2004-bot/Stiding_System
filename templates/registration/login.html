{% load static %}
<!DOCTYPE html>
<html lang="zh-hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - Stiding 排班系统</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/pages.css' %}">
</head>
<body class="login-page">
  <div class="login-box">
    <div class="login-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
        <line x1="8" y1="9" x2="8" y2="15"></line>
        <line x1="12" y1="9" x2="12" y2="15"></line>
        <line x1="16" y1="9" x2="16" y2="15"></line>
      </svg>
      <h1>Stiding 煤矿排班管理系统</h1>
    </div>
    {% if form.errors %}
    <div class="alert alert-danger">用户名或密码错误，请重新输入。</div>
    {% endif %}
    {% if next and user.is_authenticated %}
    <div class="alert alert-warning">当前账号无权访问该页面，请更换账号登录。</div>
    {% endif %}
    <form method="post" class="form" data-guard-submit>
      {% csrf_token %}
      <div class="field">
        <label for="id_username">用户名</label>
        <input class="input" type="text" name="username" id="id_username" autofocus required autocomplete="username">
      </div>
      <div class="field">
        <label for="id_password">密码</label>
        <input class="input" type="password" name="password" id="id_password" required autocomplete="current-password">
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
  </div>
</body>
</html>
